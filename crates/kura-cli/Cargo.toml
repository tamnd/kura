[package]
name = "kura-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true
description = "Command line access to a kura index, and the tool that says what a query did."

# The binary is `kura-cli` and not `kura` because the FFI crate's library target
# is already called `kura`. Two targets with one name write one file, and on
# Windows that file is target/debug/kura.pdb, which both link steps then race
# for. The loser fails with LNK1201 and the build is red for a reason that has
# nothing to do with the change that triggered it.
#
# The library had the name first and a C caller links it by that name, so the
# binary is the one that moves.
[[bin]]
name = "kura-cli"
path = "src/main.rs"

[dependencies]
kura-core = { path = "../kura-core", version = "0.1.0" }

[lints]
workspace = true
